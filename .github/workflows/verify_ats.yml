name: Verify ATS Endpoints

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - discover

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 🔬 Run ATS ${{ inputs.mode }}
        env:
          ADZUNA_APP_ID: dummy
          ADZUNA_APP_KEY: dummy
        run: python scripts/fetch_ats.py --${{ inputs.mode }}
